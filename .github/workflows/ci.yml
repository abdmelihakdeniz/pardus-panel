name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream build-essential debhelper desktop-file-utils \
            dh-python gettext lintian pybuild-plugin-pyproject python3-all python3-gi \
            python3-psutil python3-setuptools python3-wheel

      - name: Validate
        run: make validate

      - name: Lint Python code
        uses: astral-sh/ruff-action@v4.0.0
        with:
          version: "0.15.12"
          args: check --output-format=github
          src: ./src

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Lint Debian package
        run: lintian --profile debian --fail-on error

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(dpkg-parsechangelog -S Version)" = "$version"
          python3 -c 'import sys, xml.etree.ElementTree as ET; assert ET.parse("src/pardus_panel/data/metainfo/tr.org.pardus.panel.metainfo.xml").find("./releases/release").get("version") == sys.argv[1]' "$version"

      - name: Save release package
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp ../pardus-panel_*.deb .

      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: pardus-panel_*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME"
